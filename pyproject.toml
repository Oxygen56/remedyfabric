[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remedyfabric"
version = "0.1.0"
description = "Evidence-first multi-agent recovery fabric for safely repairing failing software repositories"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Oxygen56"}]
keywords = ["agent-infrastructure", "sre", "automated-repair", "audit", "goai-2026"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["coverage>=7.6", "ruff>=0.9"]

[project.scripts]
remedyfabric = "remedyfabric.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

