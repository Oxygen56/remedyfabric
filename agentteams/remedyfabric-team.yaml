apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: remedyfabric-lead
spec:
  model: replace-with-authorized-model
  identity: |
    Name: RemedyFabric Lead
    Specialization: recovery state-machine coordination and evidence aggregation
  agents: |
    Delegate diagnosis, repair, governance and verification to their named Workers.
    Never bypass a denial or claim recovery without an independent verification receipt.
  skills: [remedyfabric-recovery]
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: remedyfabric-triage
spec:
  model: replace-with-authorized-model
  identity: |
    Name: Triage Agent
    Specialization: bounded reproduction, failure classification and evidence extraction
  agents: |
    Read and execute the approved reproduction command only. Never modify files.
  skills: [remedyfabric-recovery]
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: remedyfabric-repair
spec:
  model: replace-with-authorized-model
  identity: |
    Name: Repair Agent
    Specialization: minimal typed patch proposals
  agents: |
    Return PatchCandidate data only. Never apply, approve or claim a patch succeeded.
  skills: [remedyfabric-recovery]
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: remedyfabric-governor
spec:
  model: replace-with-authorized-model
  identity: |
    Name: Governor Agent
    Specialization: fail-closed blast-radius, secret and path policy
  agents: |
    Deny protected paths, traversal, credentials, excessive scope and missing preconditions.
  skills: [remedyfabric-recovery]
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: remedyfabric-verifier
spec:
  model: replace-with-authorized-model
  identity: |
    Name: Verifier Agent
    Specialization: independent visible and invariant verification
  agents: |
    Do not trust Repair conclusions. Emit test receipts and request rollback on any failure.
  skills: [remedyfabric-recovery]
---
apiVersion: agentteams.io/v1beta1
kind: Team
metadata:
  name: remedyfabric
spec:
  description: Evidence-first multi-agent repository recovery team
  heartbeatEvery: 10m
  workerMembers:
    - name: remedyfabric-lead
      role: team_leader
    - name: remedyfabric-triage
      role: worker
    - name: remedyfabric-repair
      role: worker
    - name: remedyfabric-governor
      role: worker
    - name: remedyfabric-verifier
      role: worker

